name: PHP Lint and Smart MCQ Production Readiness Tests
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, simplexml
      - name: Lint PHP source
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Importer parser and validation smoke tests
        run: php tests/test-importer-cli.php
      - name: Exam builder tests
        run: php tests/test-exams-cli.php
      - name: Exam player safety helper tests
        run: php tests/test-player-cli.php
      - name: Grading and answer review tests
        run: php tests/test-results-cli.php
      - name: Analytics helper tests
        run: php tests/test-analytics-cli.php
      - name: Smart practice helper tests
        run: php tests/test-practice-cli.php
      - name: Step 9 report and export tests
        run: php tests/test-reports-cli.php
      - name: Step 10 session security helper tests
        run: php tests/test-security-cli.php
      - name: Practice JavaScript syntax
        run: node --check assets/practice.js
      - name: Analytics JavaScript syntax
        run: node --check assets/analytics.js
      - name: Frontend JavaScript syntax
        run: node --check assets/player.js
      - name: Step 11 premium exam access tests
        run: php tests/test-commerce-cli.php

      - name: Step 12 diagnostics and index tests
        run: php tests/test-health-cli.php
      - name: Verify syntax of every JavaScript source
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Step 13 extended question format tests
        run: php tests/test-question-types-cli.php