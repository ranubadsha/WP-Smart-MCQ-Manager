name: PHP Lint and Import Validation
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, simplexml
      - name: Lint PHP source
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Importer parser and validation smoke tests
        run: php tests/test-importer-cli.php